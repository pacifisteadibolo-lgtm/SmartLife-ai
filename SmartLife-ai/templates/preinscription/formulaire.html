<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Préinscription — SmartLife AI</title>
<style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:850px;margin:40px auto;padding:20px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:28px;box-shadow:0 4px 18px #0000000a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9dee7;border-radius:9px;font:inherit}textarea{min-height:90px}button{padding:12px 18px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.full{grid-column:1/-1}.muted{color:#6b7280}.alert{padding:12px;background:#eef2ff;border-radius:9px;margin-bottom:15px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><div class="wrap"><div class="card"><h1>Préinscription en ligne</h1><p class="muted">Remplissez le formulaire. Votre dossier sera examiné par l’administration.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert">{{message}}</div>{% endfor %}{% endwith %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid">
<div><label>Nom *</label><input name="nom" required></div><div><label>Prénom *</label><input name="prenom" required></div>
<div><label>Email *</label><input type="email" name="email" required></div><div><label>Téléphone *</label><input name="telephone" required></div>
<div><label>Date de naissance</label><input type="date" name="date_naissance"></div><div><label>Lieu de naissance</label><input name="lieu_naissance"></div>
<div><label>Filière *</label><select name="filiere_id" id="filiere" required><option value="">Choisir</option>{% for f in filieres %}<option value="{{f.id}}">{{f.nom}} ({{f.code}})</option>{% endfor %}</select></div>
<div><label>Niveau *</label><select name="niveau_id" id="niveau" required><option value="">Choisir d'abord une filière</option></select></div>
<div class="full"><label>Année académique *</label><select name="annee_academique_id" required>{% for a in annees %}<option value="{{a.id}}" {% if a.id == (annee_active.id if annee_active else 0) %}selected{% endif %}>{{a.libelle}}{% if a.active %} — active{% endif %}</option>{% endfor %}</select></div>
<div class="full"><label>Adresse</label><textarea name="adresse"></textarea></div><div class="full"><button type="submit">Envoyer ma préinscription</button></div></div></form></div></div>
<script>const f=document.getElementById('filiere'),n=document.getElementById('niveau');f.addEventListener('change',async()=>{n.innerHTML='<option>Chargement...</option>';if(!f.value){n.innerHTML='<option value="">Choisir d’abord une filière</option>';return;}const r=await fetch('/preinscription/niveaux/'+f.value);const d=await r.json();n.innerHTML=d.niveaux.length?d.niveaux.map(x=>`<option value="${x.id}">${x.nom} (${x.code})</option>`).join(''):'<option value="">Aucun niveau disponible</option>';});</script></body></html>
