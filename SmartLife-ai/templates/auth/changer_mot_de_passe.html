{% extends 'auth/_layout.html' %}{% block title %}Changer mon mot de passe{% endblock %}{% block content %}<div class="auth-card"><h1>Changer mon mot de passe</h1><p>Pour sécuriser ton compte, choisis un nouveau mot de passe.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Ancien mot de passe</label><input type="password" name="ancien_mot_de_passe" required><label>Nouveau mot de passe</label><input type="password" name="nouveau_mot_de_passe" minlength="8" required><label>Confirmation</label><input type="password" name="confirmation" minlength="8" required><button type="submit">Enregistrer</button></form></div>{% endblock %}
