{% extends "auth/_layout.html" %}
{% block title %}Créer un compte — SmartLife AI{% endblock %}
{% block content %}
  <h1>Rejoins SmartLife AI</h1>
  <p class="auth-sub">Un compte pour centraliser tes cours, ton budget et ta vie de campus.</p>

  <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="nom">Nom complet</label>
      <input type="text" id="nom" name="nom" required autofocus
             placeholder="Ex : Ama Koffi" value="{{ request.form.nom or '' }}">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required
             placeholder="toi@univ.tg" value="{{ request.form.email or '' }}">
    </div>
    <div class="field">
      <label for="filiere">Filière</label>
      <input type="text" id="filiere" name="filiere"
             placeholder="Ex : Informatique" value="{{ request.form.filiere or '' }}">
    </div>
    <div class="field">
      <label for="niveau">Niveau</label>
      <select id="niveau" name="niveau">
        <option value="">Sélectionner…</option>
        {% for n in ['Licence 1', 'Licence 2', 'Licence 3', 'Master 1', 'Master 2'] %}
          <option value="{{ n }}" {% if request.form.niveau == n %}selected{% endif %}>{{ n }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required minlength="8"
             placeholder="8 caractères minimum">
    </div>
    <div class="field">
      <label for="password_confirm">Confirmer le mot de passe</label>
      <input type="password" id="password_confirm" name="password_confirm" required minlength="8"
             placeholder="••••••••">
    </div>
    <button type="submit" class="btn-primary">Créer mon compte</button>
  </form>

  <p class="auth-switch">Déjà un compte ? <a href="{{ url_for('auth.login') }}">Se connecter</a></p>
{% endblock %}
