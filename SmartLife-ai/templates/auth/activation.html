{% extends 'base.html' %}{% block content %}<div style="max-width:520px;margin:50px auto;padding:25px;background:white;border-radius:14px"><h1>Activer votre compte</h1><p>Bienvenue {{utilisateur.nom}}. Choisissez votre mot de passe.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p>{{message}}</p>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><p><input type="password" name="password" placeholder="Nouveau mot de passe" required minlength="8"></p><p><input type="password" name="password_confirm" placeholder="Confirmer" required minlength="8"></p><button type="submit">Activer mon compte</button></form></div>{% endblock %}
