<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Espace professeur — SmartLife AI{% endblock %}</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.nav{background:#111827;color:#fff;padding:16px 24px;display:flex;gap:18px}.nav a{color:#fff;text-decoration:none}.wrap{max-width:1200px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:18px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}input{padding:8px;width:90px}button{padding:9px 13px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}.muted{color:#6b7280}.badge{padding:4px 8px;border-radius:999px;background:#eef2ff}.nav a{padding:8px 10px;border-radius:8px}.nav a:hover{background:#1f2937}.nav .active{background:#374151}@media(max-width:650px){.nav{overflow-x:auto;white-space:nowrap;padding:12px}.nav a{flex:0 0 auto}.wrap{margin-top:18px;padding:0 10px}} </style></head><body><div class="nav"><strong>SmartLife AI · Professeur</strong><a class="{{ 'active' if request.endpoint == 'professeur.accueil' else '' }}" href="{{ url_for('professeur.accueil') }}">Mes matières</a><a href="{{ url_for('dashboard.accueil') }}">SmartLife</a><a href="{{ url_for('auth.logout') }}">Déconnexion</a></div><div class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="card">{{ m }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
